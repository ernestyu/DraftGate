name: Writing Workflow CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'articles/**/index.md'
      - '.writing-state/write-commentary/**'
      - 'docs/writing/**'
      - 'scripts/**'
      - 'tests/test_writing*.py'
      - 'writing'
      - '.github/workflows/writing-workflow-ci.yml'
  pull_request:
    paths:
      - 'articles/**/index.md'
      - '.writing-state/write-commentary/**'
      - 'docs/writing/**'
      - 'scripts/**'
      - 'tests/test_writing*.py'
      - 'writing'
      - '.github/workflows/writing-workflow-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate writing workflow
        shell: bash
        env:
          WRITING_CI_BEFORE: ${{ github.event.before }}
          WRITING_CI_AFTER: ${{ github.sha }}
        run: bash scripts/ci/validate-writing.sh
